stages:
  - build

variables:
  GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PROJECT_PATH
  COMBO2_BUILD_PYTHON: python3.13
  COMBO2_DIST_DIR: dist_protected
  COMBO2_PUBLISH_DIR: /home/shared/data2/codes/factorsimteam/combo/combo2
  COMBO2_BUILD_EXTRA_ARGS: ""
  COMBO2_WHEEL_VERSION: "0.1.0"


build:
  stage: build
  tags:
    - Ares_short
  only:
    - master
  script:
    - |
      set -e

      echo "PATH=${PATH}"
      echo "Requested Python: ${COMBO2_BUILD_PYTHON}"
      echo "Python 3.13 environment probe:"
      for candidate in \
        "${COMBO2_BUILD_PYTHON}" \
        python3.13 \
        /usr/local/bin/python3.13 \
        /usr/bin/python3.13 \
        /root/.local/share/pdm/python/cpython@3.13.11/bin/python3.13 \
        /home/gitlab-runner/.local/share/pdm/python/cpython@3.13.11/bin/python3.13
      do
        if command -v "${candidate}" >/dev/null 2>&1; then
          resolved="$(command -v "${candidate}")"
        elif [ -x "${candidate}" ]; then
          resolved="${candidate}"
        else
          echo "[missing] ${candidate}"
          continue
        fi

        echo "[found] ${candidate} -> ${resolved}"
        "${resolved}" --version || true
        "${resolved}" - <<'PY' || true
      import sys
      import sysconfig
      from pathlib import Path

      python_h = Path(sysconfig.get_paths()["include"]) / "Python.h"
      print(f"version={sys.version.split()[0]}")
      print(f"executable={sys.executable}")
      print(f"include={sysconfig.get_paths()['include']}")
      print(f"python_h={python_h} exists={python_h.exists()}")
      PY
        "${resolved}" -m pip --version || true
        "${resolved}" -m ensurepip --version || true
      done

      COMBO2_PYTHON=""
      for candidate in \
        "${COMBO2_BUILD_PYTHON}" \
        python3.13 \
        /usr/local/bin/python3.13 \
        /usr/bin/python3.13 \
        /root/.local/share/pdm/python/cpython@3.13.11/bin/python3.13 \
        /home/gitlab-runner/.local/share/pdm/python/cpython@3.13.11/bin/python3.13
      do
        if command -v "${candidate}" >/dev/null 2>&1; then
          resolved="$(command -v "${candidate}")"
        elif [ -x "${candidate}" ]; then
          resolved="${candidate}"
        else
          continue
        fi

        if "${resolved}" - <<'PY'; then
      import sys
      import sysconfig
      from pathlib import Path

      python_h = Path(sysconfig.get_paths()["include"]) / "Python.h"
      if sys.version_info[:2] != (3, 13):
          raise SystemExit(1)
      if not python_h.exists():
          raise SystemExit(1)
      PY
          COMBO2_PYTHON="${resolved}"
          break
        fi
      done

      if [ -z "${COMBO2_PYTHON}" ]; then
        echo "No usable Python 3.13 environment found."
        echo "Need Python 3.13 with working pip and Python.h. Install/fix python3.13-pip + python3.13-dev, or set COMBO2_BUILD_PYTHON to a working Python 3.13 path."
        exit 1
      fi

      export COMBO2_PYTHON
      echo "Using build Python: ${COMBO2_PYTHON}"
      "${COMBO2_PYTHON}" --version

      rm -rf .ci-pip .ci-get-pip.py
      if ! "${COMBO2_PYTHON}" -m pip --version; then
        echo "Python 3.13 pip is not usable; bootstrapping pip into ${PWD}/.ci-pip"
        "${COMBO2_PYTHON}" - <<'PY'
      from pathlib import Path
      from urllib.request import urlretrieve

      url = "https://bootstrap.pypa.io/get-pip.py"
      target = Path(".ci-get-pip.py")
      print(f"downloading {url} -> {target}")
      urlretrieve(url, target)
      PY
        "${COMBO2_PYTHON}" .ci-get-pip.py --target "${PWD}/.ci-pip" --no-warn-script-location
        export PYTHONPATH="${PWD}/.ci-pip${PYTHONPATH:+:${PYTHONPATH}}"
      fi
      "${COMBO2_PYTHON}" -m pip --version

      if ! command -v gcc >/dev/null 2>&1 && ! command -v cc >/dev/null 2>&1; then
        echo "Cython extension build requires gcc or cc in PATH."
        exit 1
      fi

      "${COMBO2_PYTHON}" packaging/build_protected_wheel.py --python "${COMBO2_PYTHON}" --name combo2 --version "${COMBO2_WHEEL_VERSION}" --dist-dir "${COMBO2_DIST_DIR}" ${COMBO2_BUILD_EXTRA_ARGS}
      mkdir -p "${COMBO2_PUBLISH_DIR}"
      cp -v "${COMBO2_DIST_DIR}"/combo2-*.whl "${COMBO2_PUBLISH_DIR}/"
  artifacts:
    name: "combo2-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist_protected/*.whl
    expire_in: 30 days
